name: Java Application CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('java-ci-pr-{0}', github.event.pull_request.number) || format('java-ci-branch-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit and integration tests
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Show toolchain
        shell: pwsh
        run: |
          java -version
          mvn -version
          git --version
      - name: Build and verify
        run: mvn -B -ntp clean verify
      - name: Generate Surefire HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/surefire-reports') {
            mvn -B -ntp surefire-report:report-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Generate JaCoCo HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/jacoco.exec') {
            mvn -B -ntp jacoco:report
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: task-manager-jar
          path: target/task-manager-cicd-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
